{% load static %}
<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Dashboard de la plataforma de Estadística Educativa."
    />
    <title>Estadística Educativa - Dashboard</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
    />

    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
  </head>
  <body>
    <header
      class="navbar navbar-expand-lg navbar-light bg-white border-bottom shadow-sm"
    >
      <div class="navbar-container container-fluid">
        <a class="navbar-brand app-title" href="#">
          <img
            src="/static/img/logoEstMini.png"
            alt="Estadística Educativa"
            class="brand-image"
            style="opacity: 0.8; height: 30px; width: auto; margin-top: -0.2rem"
          />
          <span class="icon-stats"></span>
          Estadística Educativa
        </a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#mainNavbarContent"
          aria-controls="mainNavbarContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse order-3" id="mainNavbarContent">
          <nav class="main-menu navbar-nav me-auto">
            <ul class="navbar-nav">
              <li class="nav-item">
                <a href="#" class="nav-link">
                  <span class="fas fa-home" style="color: orange"></span> Home
                </a>
              </li>

              <li class="nav-item dropdown">
                <a
                  href="#"
                  class="nav-link dropdown-toggle"
                  id="establecimientoDropdown"
                  role="button"
                  data-bs-toggle="dropdown"
                  aria-expanded="false"
                >
                  <span class="fas fa-globe" style="color: blue"></span>
                  Establecimiento
                </a>
              </li>

              <li class="nav-item dropdown">
                <a
                  id="dropdownSubMenu1"
                  href="#"
                  data-bs-toggle="dropdown"
                  aria-haspopup="true"
                  aria-expanded="false"
                  class="nav-link dropdown-toggle"
                  role="button"
                >
                  <i class="fas fa-archive" style="color: black"></i> Evaluación
                  Fluidez
                </a>
                <ul
                  aria-labelledby="dropdownSubMenu1"
                  class="dropdown-menu border-0 shadow"
                >
                  <li>
                    <a href="{% url 'grados' %}" class="dropdown-item"
                      >Carga evaluación</a
                    >
                  </li>
                  <li>
                    <a
                      href="{% url 'lista_grado' grado='SEGUNDO'%}"
                      class="dropdown-item"
                      >Control de carga 2 Grado</a
                    >
                  </li>
                  <li>
                    <a
                      href="{% url 'lista_grado' grado='TERCERO'%}"
                      class="dropdown-item"
                      >Control de carga 3 Grado</a
                    >
                  </li>
                </ul>
              </li>

              <li class="nav-item dropdown">
                <a
                  href="#"
                  class="nav-link dropdown-toggle"
                  id="relevamientoDropdown"
                  role="button"
                  data-bs-toggle="dropdown"
                  aria-expanded="false"
                >
                  <span class="fas fa-file" style="color: violet"></span>
                  Relevamiento
                </a>
              </li>
            </ul>
            <div class="py-2 d-lg-none d-xl-none">
                <a href="{% url 'salir' %}" class="btn btn-danger btn-custom"
                  >Cerrar Sesión</a
                >
              </div>
            </div>
          </nav>
        </div>
      </div>
      <div class="ms-auto d-none d-lg-flex">
    <a href="{% url 'salir' %}" class="btn btn-danger btn-custom">Cerrar Sesión</a>
</div>
    </header>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
